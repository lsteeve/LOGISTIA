name: LOGISTIA Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action a executer"
        required: true
        default: ansible_only
        type: choice
        options:
          - full
          - terraform_only
          - ansible_only

jobs:
  deploy:
    name: Deploiement LOGISTIA
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Verification sauvegarde backup-logistia
        if: ${{ inputs.action == 'full' || inputs.action == 'terraform_only' }}
        run: |
          echo "Verification sauvegarde recente sur backup-logistia..."
          BACKUP_COUNT=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/logistia_ed25519 logistia@10.60.60.10 \
            "find /backup/logistia -maxdepth 1 -type d -mmin -180 2>/dev/null | wc -l" || echo "0")
          echo "Sauvegardes recentes trouvees: $BACKUP_COUNT"
          if [ "$BACKUP_COUNT" -eq "0" ]; then
            echo "ERREUR: Aucune sauvegarde recente sur backup-logistia (moins de 3h)"
            echo "Lancez d abord une sauvegarde manuelle :"
            echo "  ssh logistia@10.60.60.10 sudo /opt/logistia-backup.sh"
            echo "Puis relancez le pipeline."
            exit 1
          fi
          echo "Sauvegarde recente confirmee - deploiement Terraform autorise"

      - name: Creer terraform.tfvars
        if: ${{ inputs.action == 'full' || inputs.action == 'terraform_only' }}
        run: |
          cat > infra/terraform/terraform.tfvars << TFEOF
          proxmox_url     = "${{ secrets.PROXMOX_URL }}"
          proxmox_user    = "${{ secrets.PROXMOX_USER }}"
          proxmox_token   = "${{ secrets.PROXMOX_PASSWORD }}"
          proxmox_node    = "PVE"
          proxmox_storage = "local-lvm"
          ssh_public_key  = "${{ secrets.SSH_PUBLIC_KEY }}"
          vmid_start      = 100
          TFEOF

      - name: Terraform init
        if: ${{ inputs.action == 'full' || inputs.action == 'terraform_only' }}
        run: cd infra/terraform && terraform init

      - name: Terraform apply
        if: ${{ inputs.action == 'full' || inputs.action == 'terraform_only' }}
        run: cd infra/terraform && terraform plan -out=logistia-plan.tfplan && terraform apply logistia-plan.tfplan

      - name: Attente cloud-init
        if: ${{ inputs.action == 'full' }}
        run: sleep 90

      - name: Preparer cle SSH
        if: ${{ inputs.action == 'full' || inputs.action == 'ansible_only' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/logistia_ed25519
          chmod 600 ~/.ssh/logistia_ed25519

      - name: Ansible deploy
        if: ${{ inputs.action == 'full' || inputs.action == 'ansible_only' }}
        run: |
          ANSIBLE_ROLES_PATH=$GITHUB_WORKSPACE/ansible/roles \
          ansible-playbook \
            -i ansible/logistia-inventory.ini \
            --limit '!devops-logistia:!router-logistia' \
            ansible/playbooks/logistia-site.yml \
            --private-key ~/.ssh/logistia_ed25519 \
            -v

      - name: Nettoyage fichiers sensibles
        if: always()
        run: |
          rm -f infra/terraform/terraform.tfvars
          rm -f infra/terraform/logistia-plan.tfplan
          rm -f ~/.ssh/logistia_ed25519
