#cloud-config
# LOGISTIA — Configuration initiale Debian 13 Trixie

package_update: true
package_upgrade: false

packages:
  - qemu-guest-agent
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - ca-certificates
  - gpg
  - python3
  - python3-pip
  - rsyslog
  - sudo
  - openssh-server

users:
  - name: logistia
    gecos: LOGISTIA Project User
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKyuQ0Y49pILldhE1cpDX+1y8kXKs8O3H5IDQaedUdPW logistia-project

runcmd:
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  - echo "logistia ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/logistia
  - chmod 440 /etc/sudoers.d/logistia
  - systemctl enable ssh
  - systemctl start ssh

timezone: Europe/Paris
ssh_pwauth: false
final_message: "LOGISTIA — machine prete"
