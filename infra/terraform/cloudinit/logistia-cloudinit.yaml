#cloud-config
# LOGISTIA — Configuration initiale Debian 13 Trixie

package_update: true
package_upgrade: false

# DNS force (evite l'heritage d'un mauvais resolveur au boot)
manage_resolv_conf: true
resolv_conf:
  nameservers:
    - 8.8.8.8
    - 1.1.1.1

packages:
  - qemu-guest-agent
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - ca-certificates
  - gpg
  - python3
  - python3-pip
  - rsyslog
  - sudo
  - openssh-server

users:
  - name: logistia
    gecos: LOGISTIA Project User
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKyuQ0Y49pILldhE1cpDX+1y8kXKs8O3H5IDQaedUdPW logistia-project

runcmd:
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  - echo "logistia ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/logistia
  - chmod 440 /etc/sudoers.d/logistia
  - systemctl enable ssh
  - systemctl start ssh
  - mkdir -p /etc/systemd/resolved.conf.d
  - printf '[Resolve]\nDNS=8.8.8.8 1.1.1.1\n' > /etc/systemd/resolved.conf.d/logistia.conf
  - systemctl restart systemd-resolved || true

timezone: Europe/Paris
ssh_pwauth: false
final_message: "LOGISTIA — machine prete"
