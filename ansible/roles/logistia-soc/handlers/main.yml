---
- name: restart syslog-ng
  service:
    name: syslog-ng
    state: restarted

- name: restart prometheus
  service:
    name: prometheus
    state: restarted

- name: restart wazuh-agent
  service:
    name: wazuh-agent
    state: restarted

- name: restart wazuh-manager
  systemd:
    name: wazuh-manager
    state: restarted
  failed_when: false
