---
- name: Installer dependances ia-logistia
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - curl
      - jq
    state: present

- name: Installer Ollama
  shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: /usr/local/bin/ollama

- name: Repertoire configuration Ollama
  file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: '0755'

- name: Ollama ecoute sur reseau LOGISTIA
  copy:
    dest: /etc/systemd/system/ollama.service.d/logistia-network.conf
    content: |
      [Service]
      Environment="OLLAMA_HOST=0.0.0.0:11434"

- name: Activer Ollama
  systemd:
    name: ollama
    enabled: true
    state: started
    daemon_reload: true


- name: Telecharger le modele phi3:mini (moteur d'analyse IA)
  command: ollama pull phi3:mini
  args:
    creates: /usr/share/ollama/.ollama/models/manifests/registry.ollama.ai/library/phi3
  environment:
    OLLAMA_HOST: "127.0.0.1:11434"
  register: ollama_pull
  retries: 2
  delay: 10
  until: ollama_pull.rc == 0

- name: Node Exporter metriques soc-logistia
  apt:
    name: prometheus-node-exporter
    state: present

- name: Activer Node Exporter
  systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
