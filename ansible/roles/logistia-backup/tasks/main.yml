---
- name: Installer rsync et cron sur backup-logistia
  apt:
    name:
      - rsync
      - cron
    state: present

- name: Repertoires sauvegarde LOGISTIA
  file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
  loop:
    - /opt/logistia-backup
    - /opt/logistia-backup/logistia-app
    - /opt/logistia-backup/logistia-db
    - /opt/logistia-backup/logistia-soc
    - /var/log/logistia-backup

- name: Script logistia-backup.sh
  copy:
    dest: /opt/logistia-backup/logistia-backup.sh
    mode: '0750'
    content: |
      #!/bin/bash
      # LOGISTIA — Sauvegarde rsync regle 3-2-1
      DATE=$(date +%Y%m%d_%H%M%S)
      LOG=/var/log/logistia-backup/logistia-backup_${DATE}.log

      echo "=== LOGISTIA Backup ${DATE} ===" | tee $LOG

      rsync -avz --delete \
        -e "ssh -i /root/.ssh/logistia_ed25519 -o StrictHostKeyChecking=no" \
        logistia@10.10.10.10:/opt/logistia-app/ \
        /opt/logistia-backup/logistia-app/ 2>&1 | tee -a $LOG

      ssh -i /root/.ssh/logistia_ed25519 logistia@10.20.20.10 \
        "sudo mysqldump --all-databases" \
        > /opt/logistia-backup/logistia-db/logistia-dump_${DATE}.sql
      echo "Backup logistia-db : $?" | tee -a $LOG

      rsync -avz \
        -e "ssh -i /root/.ssh/logistia_ed25519 -o StrictHostKeyChecking=no" \
        logistia@10.40.40.10:/var/ossec/etc/ \
        /opt/logistia-backup/logistia-soc/ 2>&1 | tee -a $LOG

      find /opt/logistia-backup/logistia-db -name "*.sql" -mtime +7 -delete

      echo "=== LOGISTIA Backup termine ===" | tee -a $LOG

- name: Cron sauvegarde LOGISTIA quotidien 2h
  cron:
    name: "logistia-backup quotidien"
    minute: "0"
    hour: "2"
    job: "/opt/logistia-backup/logistia-backup.sh"
    state: present

- name: Node Exporter metriques soc-logistia
  apt:
    name: prometheus-node-exporter
    state: present

- name: Activer Node Exporter
  systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
