---
- name: Paquets router-logistia
  apt:
    name:
      - nftables
      - dnsmasq
      - iproute2
      - ifupdown
    state: present
    update_cache: yes

- name: IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: Interfaces VLAN permanentes
  copy:
    dest: /etc/network/interfaces
    content: |
      auto lo
      iface lo inet loopback

      auto eth0
      iface eth0 inet static
          address 192.168.10.151/24
          gateway 192.168.10.254

      auto ens19
      iface ens19 inet static
          address 10.10.10.1/24

      auto ens20
      iface ens20 inet static
          address 10.20.20.1/24

      auto ens21
      iface ens21 inet static
          address 10.30.30.1/24

      auto ens22
      iface ens22 inet static
          address 10.40.40.1/24

      auto ens23
      iface ens23 inet static
          address 10.50.50.1/24

      auto ens1
      iface ens1 inet static
          address 10.60.60.1/24

      auto ens2
      iface ens2 inet static
          address 10.70.70.1/24

- name: Activer interfaces VLAN
  shell: |
    for iface in ens19 ens20 ens21 ens22 ens23 ens1 ens2; do
      ip link set $iface up 2>/dev/null || true
    done
    ip addr add 10.10.10.1/24 dev ens19 2>/dev/null || true
    ip addr add 10.20.20.1/24 dev ens20 2>/dev/null || true
    ip addr add 10.30.30.1/24 dev ens21 2>/dev/null || true
    ip addr add 10.40.40.1/24 dev ens22 2>/dev/null || true
    ip addr add 10.50.50.1/24 dev ens23 2>/dev/null || true
    ip addr add 10.60.60.1/24 dev ens1 2>/dev/null || true
    ip addr add 10.70.70.1/24 dev ens2 2>/dev/null || true
  changed_when: false

- name: Forwarding IPv4 persistant (fichier prioritaire sysctl.d)
  copy:
    dest: /etc/sysctl.d/99-logistia-router.conf
    content: "net.ipv4.ip_forward=1\n"
    mode: '0644'
  notify: reload sysctl

- name: Repertoire drop-in systemd pour nftables
  file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: '0755'

- name: Forcer le forwarding apres chargement nftables
  copy:
    dest: /etc/systemd/system/nftables.service.d/logistia-forward.conf
    content: |
      [Service]
      ExecStartPost=/usr/sbin/sysctl -w net.ipv4.ip_forward=1
    mode: '0644'
  notify: reload systemd

- name: Regles nftables LOGISTIA
  copy:
    dest: /etc/nftables.conf
    mode: '0644'
    content: |
      #!/usr/sbin/nft -f
      flush ruleset

      table inet logistia-filter {
        chain input {
          type filter hook input priority 0
          policy drop

          ct state established,related accept
          iif lo accept
          tcp dport 22 accept
          icmp type echo-request limit rate 5/second accept
        }

        chain forward {
          type filter hook forward priority 0
          policy drop

          ct state established,related accept

          iif eth0 oif ens19 tcp dport { 80, 443 } accept
          iif ens19 oif ens20 ip daddr 10.20.20.10 tcp dport 3306 accept
          iif ens21 tcp dport 22 accept
          oif ens22 tcp dport { 514, 1514, 1515 } accept
          oif ens22 udp dport 514 accept
          iif ens22 tcp dport 9100 accept
          iif ens23 oif ens22 ip daddr 10.40.40.10 tcp dport 9200 accept
          iif ens22 oif ens23 ip daddr 10.50.50.10 tcp dport 11434 accept
          iif ens1 tcp dport 22 accept
          iif ens2 tcp dport 22 accept
          iif ens2 oif eth0 ip daddr 192.168.10.150 tcp dport 8006 accept
          ip saddr { 10.10.10.0/24, 10.20.20.0/24, 10.30.30.0/24, 10.40.40.0/24, 10.50.50.0/24, 10.60.60.0/24, 10.70.70.0/24 } oif eth0 accept

          # Acces VM admin (VLAN WAN 192.168.10.0/24) vers les VLAN internes
          ip saddr 192.168.10.0/24 ip daddr 10.10.10.0/24 accept
          ip saddr 192.168.10.0/24 ip daddr 10.20.20.0/24 accept
          ip saddr 192.168.10.0/24 ip daddr 10.30.30.0/24 accept
          ip saddr 192.168.10.0/24 ip daddr 10.40.40.0/24 accept
          ip saddr 192.168.10.0/24 ip daddr 10.50.50.0/24 accept
          ip saddr 192.168.10.0/24 ip daddr 10.60.60.0/24 accept
          ip saddr 192.168.10.0/24 ip daddr 10.70.70.0/24 accept
        }

        chain output {
          type filter hook output priority 0
          policy accept
        }
      }

      table ip logistia-nat {
        chain postrouting {
          type nat hook postrouting priority 100
          ip saddr { 10.10.10.0/24, 10.20.20.0/24, 10.30.30.0/24, 10.40.40.0/24, 10.50.50.0/24, 10.60.60.0/24, 10.70.70.0/24 } oif eth0 masquerade
        }
      }
  notify: reload nftables

- name: Activer nftables
  systemd:
    name: nftables
    enabled: yes
    state: started

- name: dnsmasq configuration
  copy:
    dest: /etc/dnsmasq.conf
    content: |
      bind-interfaces
      interface=ens19
      interface=ens20
      interface=ens21
      interface=ens22
      interface=ens23
      interface=ens1
      interface=ens2
      dhcp-range=10.10.10.100,10.10.10.200,12h
      dhcp-range=10.20.20.100,10.20.20.200,12h
      dhcp-range=10.30.30.100,10.30.30.200,12h
      dhcp-range=10.40.40.100,10.40.40.200,12h
      dhcp-range=10.50.50.100,10.50.50.200,12h
      dhcp-range=10.60.60.100,10.60.60.200,12h
      dhcp-range=10.70.70.100,10.70.70.200,12h
      server=8.8.8.8
      server=1.1.1.1
  notify: restart dnsmasq

- name: Activer dnsmasq
  systemd:
    name: dnsmasq
    enabled: yes
    state: started
  ignore_errors: yes
