[logistia-routers]
router-logistia ansible_host=192.168.10.151

[logistia-apps]
app-logistia ansible_host=10.10.10.10

[logistia-databases]
db-logistia ansible_host=10.20.20.10

[logistia-devops]
devops-logistia ansible_host=10.30.30.10

[logistia-soc]
soc-logistia ansible_host=10.40.40.10

[logistia-ia]
ia-logistia ansible_host=10.50.50.10

[logistia-backup]
backup-logistia ansible_host=10.60.60.10

[all:vars]
ansible_user=logistia
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/logistia_ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_become=yes
ansible_become_method=sudo
