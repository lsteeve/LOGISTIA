  <text x="1245" y="650" text-anchor="middle" font-size="10" fill="#41586f">gestion des</text>
  <text x="1245" y="663" text-anchor="middle" font-size="10" fill="#41586f">incidents</text>

  <!-- chaine SOC : fleches -->
  <path d="M850,630 L866,630" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M1011,630 L1023,630" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M1163,630 L1175,630" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- bandeau chaine detection -->
  <rect x="650" y="690" width="665" height="72" rx="9" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.2"/>
  <text x="662" y="712" font-size="12.5" font-weight="700" fill="#1f3a5f">Chaîne de sécurité :</text>
  <text x="662" y="734" font-size="11.5" fill="#41586f">1. Détecter (Wazuh + règles + CTI MISP)   →   2. Comprendre (IA : Isolation Forest + phi3)   →</text>
  <text x="662" y="752" font-size="11.5" fill="#41586f">3. Répondre (SOAR : blocage automatique)   →   4. Enquêter (TheHive + Cortex)</text>

  <!-- agents Wazuh (mention) -->
  <path d="M695,504 C695,530 720,560 748,590" fill="none" stroke="#8a94a6" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <path d="M850,504 C850,540 800,560 770,590" fill="none" stroke="#8a94a6" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <path d="M1110,504 C1110,530 900,560 852,610" fill="none" stroke="#8a94a6" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <path d="M1265,504 C1265,540 900,570 852,625" fill="none" stroke="#8a94a6" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="620" y="545" text-anchor="end" font-size="9.5" fill="#8a94a6" transform="rotate(0)"></text>
  <rect x="628" y="516" width="230" height="20" rx="5" fill="#eef1f5"/>
  <text x="640" y="530" font-size="10" fill="#5a6b7f">Agents Wazuh sur les 9 machines → logs remontés au SOC</text>

  <!-- ===== VLAN70 Admin ===== -->
  <g filter="url(#sh)">
    <rect x="628" y="800" width="705" height="66" rx="10" fill="#eef1f5" stroke="#5a6b7f" stroke-width="1.4"/>
  </g>
  <text x="648" y="826" font-size="13.5" font-weight="700" fill="#1f3a5f">VLAN70 · Admin  ·  10.70.70.0/24</text>
  <text x="648" y="847" font-size="11" fill="#41586f">Poste d'administration — seul autorisé en SSH (port 22) sur toutes les VM et à l'interface Proxmox (8006).</text>
  <text x="648" y="861" font-size="10" fill="#8a94a6">Zone d'administration cloisonnée, à surface d'exposition réduite.</text>

  <!-- ======================= LEGENDE ======================= -->
  <g filter="url(#sh)">
    <rect x="60" y="400" width="500" height="590" rx="12" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.4"/>
  </g>
  <text x="80" y="428" font-size="15" font-weight="700" fill="#1f3a5f">Légende &amp; principes</text>

  <line x1="80" y1="442" x2="540" y2="442" stroke="#e1e4e8" stroke-width="1"/>

  <!-- vpn -->
  <line x1="88" y1="462" x2="128" y2="462" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="8 5"/>
  <text x="140" y="466" font-size="12" fill="#41586f">Liaison VPN chiffrée (architecture cible, non déployée en lab)</text>
  <!-- internet -->
  <line x1="88" y1="486" x2="128" y2="486" stroke="#5a6b7f" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="140" y="490" font-size="12" fill="#41586f">Accès Internet (HTTPS 443 uniquement)</text>
  <!-- flux autorise -->
  <line x1="88" y1="510" x2="128" y2="510" stroke="#5a6b7f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="514" font-size="12" fill="#41586f">Flux réseau autorisé (deny by default)</text>
  <!-- agents -->
  <line x1="88" y1="534" x2="128" y2="534" stroke="#8a94a6" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="140" y="538" font-size="12" fill="#41586f">Remontée des logs des agents vers le SOC</text>

  <line x1="80" y1="556" x2="540" y2="556" stroke="#e1e4e8" stroke-width="1"/>

  <text x="80" y="580" font-size="13" font-weight="700" fill="#1f3a5f">Segmentation en 7 VLAN — 10 machines virtuelles</text>
  <g font-size="11.5" fill="#41586f">
    <rect x="88" y="592" width="16" height="12" rx="3" fill="#fff7ed" stroke="#e08a2b"/>
    <text x="112" y="602">VLAN10 DMZ — serveur applicatif exposé</text>
    <rect x="88" y="612" width="16" height="12" rx="3" fill="#eef7f0" stroke="#3a9d5d"/>
    <text x="112" y="622">VLAN20 Data — base MariaDB isolée</text>
    <rect x="88" y="632" width="16" height="12" rx="3" fill="#eef1f7" stroke="#3d5a99"/>
    <text x="112" y="642">VLAN30 DevOps — CI/CD, Terraform, Ansible</text>
    <rect x="88" y="652" width="16" height="12" rx="3" fill="#fbf0f0" stroke="#c0392b"/>
    <text x="112" y="662">VLAN40 SOC — SIEM + MISP + Cortex + TheHive</text>
    <rect x="88" y="672" width="16" height="12" rx="3" fill="#f3eef9" stroke="#7d4fbf"/>
    <text x="112" y="682">VLAN50 IA — détection d'anomalies (local)</text>
    <rect x="88" y="692" width="16" height="12" rx="3" fill="#eef4f7" stroke="#2b8ca6"/>
    <text x="112" y="702">VLAN60 Backup — sauvegardes 3-2-1</text>
    <rect x="88" y="712" width="16" height="12" rx="3" fill="#eef1f5" stroke="#5a6b7f"/>
    <text x="112" y="722">VLAN70 Admin — administration cloisonnée</text>
  </g>

  <line x1="80" y1="738" x2="540" y2="738" stroke="#e1e4e8" stroke-width="1"/>

  <text x="80" y="762" font-size="13" font-weight="700" fill="#1f3a5f">Principes de sécurité</text>
  <g font-size="11.5" fill="#41586f">
    <text x="88" y="784">• Security by design — durcissement dès le déploiement</text>
    <text x="88" y="804">• Moindre privilège — pare-feu nftables « deny by default »</text>
    <text x="88" y="824">• Défense en profondeur — cloisonnement des zones</text>
    <text x="88" y="844">• Point d'entrée unique — routeur filtrant + surveillé</text>
    <text x="88" y="864">• Base de données jamais exposée à Internet</text>
    <text x="88" y="884">• Traçabilité — journalisation centralisée (SIEM)</text>
  </g>

  <line x1="80" y1="902" x2="540" y2="902" stroke="#e1e4e8" stroke-width="1"/>
  <text x="80" y="924" font-size="12" font-weight="700" fill="#1f3a5f">Automatisation (IaC)</text>
  <text x="88" y="944" font-size="11.5" fill="#41586f">Terraform (création des 10 VM) + Ansible (configuration),</text>
  <text x="88" y="962" font-size="11.5" fill="#41586f">déployables manuellement ou via GitHub Actions (CI/CD).</text>
  <text x="88" y="980" font-size="10.5" fill="#8a94a6">Dépôt : github.com/lsteeve/LOGISTIA</text>
</svg>
