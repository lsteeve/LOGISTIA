  </g>
  <rect x="600" y="95" width="770" height="40" rx="16" fill="url(#gband)"/>
  <rect x="600" y="118" width="770" height="17" fill="#2e5e8c"/>
  <text x="985" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">SIÈGE — Hyperviseur Proxmox VE 9  ·  192.168.10.150</text>

