    <text x="240" y="192" text-anchor="middle" font-size="10.5" fill="#41586f">appli web</text>
    <text x="240" y="207" text-anchor="middle" font-size="10.5" fill="#41586f">suivi logistique</text>
    <text x="240" y="224" text-anchor="middle" font-size="10.5" fill="#41586f">capteurs IoT</text>
    <text x="240" y="238" text-anchor="middle" font-size="10.5" fill="#41586f">(temp., RFID)</text>
