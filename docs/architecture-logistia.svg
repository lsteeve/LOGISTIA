    <text x="530" y="187" text-anchor="middle" font-size="10" fill="#a5352a">chiffrés (cible)</text>
  </g>

  <!-- ======================= INTERNET ======================= -->
  <g filter="url(#sh)">
    <ellipse cx="240" cy="330" rx="70" ry="30" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.5"/>
  </g>
  <text x="240" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#5a6b7f">Internet</text>
  <text x="240" y="345" text-anchor="middle" font-size="10.5" fill="#8a94a6">HTTPS 443</text>
  <path d="M310,335 C420,345 500,320 605,315" fill="none" stroke="#5a6b7f" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrow)"/>

