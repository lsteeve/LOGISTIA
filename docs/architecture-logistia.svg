  <text x="980" y="491" text-anchor="middle" font-size="9.5" fill="#41586f">Terraform·Ansible</text>

  <!-- VLAN50 IA -->
  <g filter="url(#sh)"><rect x="1043" y="400" width="135" height="104" rx="9" fill="#f3eef9" stroke="#7d4fbf" stroke-width="1.4"/></g>
  <text x="1110" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5e3a99">VLAN50 · IA</text>
