  <g filter="url(#sh)"><rect x="1175" y="592" width="140" height="76" rx="9" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/></g>
  <text x="1245" y="614" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">thehive-logistia</text>
