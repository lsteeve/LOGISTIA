  <line x1="980" y1="504" x2="980" y2="525" stroke="#5a6b7f" stroke-width="1.8"/>
  <line x1="980" y1="525" x2="980" y2="545" stroke="#c0392b" stroke-width="2" stroke-dasharray="1 0"/>

