  <g filter="url(#sh)">
    <rect x="800" y="270" width="360" height="66" rx="10" fill="#1f3a5f"/>
  </g>
  <text x="980" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">router-logistia · 192.168.10.151</text>
  <text x="980" y="320" text-anchor="middle" font-size="11.5" fill="#c9d4e0">point d'entrée unique · nftables (NAT + filtrage inter-VLAN) · terminaison VPN</text>

